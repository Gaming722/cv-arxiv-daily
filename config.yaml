# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "Gaming722"
repo_name: "cv-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 15

publish_readme: True
publish_gitpage: True
publish_wechat: False

# Papers whose (Semantic Scholar-sourced) author affiliations match any of
# these strings (case-insensitive substring match) get pinned to the top of
# their section as a rough quality signal. Best-effort only - affiliation
# data is often missing, especially for very recent papers. Add/remove freely.
top_labs: ["Stanford", "MIT", "UC Berkeley", "Carnegie Mellon", "CMU", "ETH Zurich",
           "Google DeepMind", "DeepMind", "Google Research", "Meta AI", "FAIR",
           "NVIDIA", "Boston Dynamics", "Toyota Research Institute", "Tsinghua",
           "Zhejiang University", "Shanghai AI Lab", "Unitree Robotics"]

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
# Each top-level key becomes a section in README/GitHub Pages; `filters` are
# arxiv full-text search phrases OR'd together. Add/remove/edit freely.
keywords:
    "Legged Locomotion":
        filters: ["legged locomotion", "quadruped locomotion", "bipedal locomotion",
                  "humanoid locomotion", "legged robot control", "quadrupedal robot"]
    "Loco-Manipulation":
        filters: ["loco-manipulation", "legged manipulation", "whole-body manipulation",
                  "mobile manipulation robot", "humanoid manipulation"]
    "Reinforcement Learning for Legged Robots":
        filters: ["reinforcement learning for legged robots", "reinforcement learning for locomotion",
                  "sim-to-real reinforcement learning robot", "reward shaping legged robot",
                  "reinforcement learning quadruped"]
    "World Models for Robotics":
        filters: ["world model for robot", "world model for manipulation",
                  "learned world model robot", "model-based reinforcement learning robot",
                  "world model locomotion"]
    "Humanoid Robots":
        filters: ["humanoid robot control", "humanoid robot learning", "humanoid whole-body control"]
    "Character Control & Game RL":
        filters: ["character control reinforcement learning", "physics-based character animation",
                  "motion imitation reinforcement learning", "reinforcement learning game playing",
                  "game AI reinforcement learning", "adversarial motion priors"]
